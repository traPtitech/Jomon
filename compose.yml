services:
  proxy:
    image: nginx:latest@sha256:689fbc6acfefc8a172d86d5779265fd52dd82e8c6b0c68c7d4aa35734340eb2a
    ports:
      - "3000:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - jomon-server

  jomon-server:
    build:
      # FIXME: Dockerfileのstageで開発用と本番用を分ける
      # Dockerfile.devは消せる
      context: ./
      dockerfile: ./Dockerfile.dev
    environment:
      MARIADB_USERNAME: root
      MARIADB_PASSWORD: password
      MARIADB_HOSTNAME: db
      MARIADB_DATABASE: jomon
      SESSION_KEY: secret
      IS_DEBUG_MODE: "true"
      UPLOAD_DIR: ./uploads
    ports:
      - "1323:1323"
    volumes:
      - "./uploads:/src/uploads"
    depends_on:
      db:
        condition: service_healthy
    tty: true
    develop:
      watch:
        - path: ./
          action: sync+restart
          target: /src
          ignore:
            - uploads

  db:
    image: mariadb:10.11.4@sha256:385c0ba6270307511a511ad915350736602c33fafb3f63f663c853920424c365
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: jomon
      TZ: Asia/Tokyo
    command: mysqld --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    volumes:
      - "./docker/mysql:/docker-entrypoint-initdb.d"
    expose:
      - "3306"
    ports:
      - "3306:3306"
    healthcheck:
      test: [
        "CMD",
        "healthcheck.sh",
        "--su-mysql",
        "--connect",
        "--innodb_initialized"
      ]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 3

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest@sha256:16d0f09c25a2dee07739af9dc11e72c1bf7fb776a449f6cc03ec00b33d0c6d9b
    environment:
      - PMA_ARBITRARY=1
      - PMA_HOST=db
      - PMA_USER=root
      - PMA_PASSWORD=password
    ports:
      - 8888:80
