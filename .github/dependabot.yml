# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://help.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

# cooldown: 公開直後の版を短期quarantineする（traPtitech/gha-security 準拠）
# https://github.com/traPtitech/gha-security
version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: monthly
      time: "00:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 10
    reviewers:
      - H1rono
    labels:
      - "dependencies"
    cooldown:
      default-days: 3

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
      time: "00:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 10
    reviewers:
      - H1rono
    labels:
      - "dependencies"
    cooldown:
      default-days: 3

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      time: "00:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 10
    reviewers:
      - H1rono
    labels:
      - "dependencies"
    cooldown:
      default-days: 3
